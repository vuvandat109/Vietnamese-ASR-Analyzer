services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ASR_PORT:-8001}:8000"
    environment:
      ASR_DATASET_DIR: /app/dataset
      MAX_UPLOAD_MB: "50"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - type: bind
        source: ./dataset
        target: /app/dataset
        read_only: true
        bind:
          create_host_path: false
      - model_cache:/home/asr/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_cache: