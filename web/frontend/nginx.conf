server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Chuyển các API cũ của frontend sang API v1.
    location /api/ {
        rewrite ^/api/statistics$ /api/v1/analytics/statistics break;
        rewrite ^/api/audio-list$ /api/v1/analytics/audio-list break;
        rewrite ^/api/model-comparison$ /api/v1/analytics/model-comparison break;
        rewrite ^/api/audio-detail/(.*)$ /api/v1/analytics/audio-detail/$1 break;
        rewrite ^/api/test-audio$ /api/v1/asr/transcribe break;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Chuyển yêu cầu phát âm thanh tới backend.
    location /audio/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Phục vụ giao diện React và các đường dẫn phía frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}